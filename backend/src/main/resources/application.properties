spring.application.name=AndroidDrop

# Listens on every interface so phones on the same Wi-Fi can connect.
server.port=8080

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
# Uploads are streamed as raw request bodies, not multipart.
spring.servlet.multipart.enabled=false
# A connection that goes quiet this long (Wi-Fi dropped) is closed, so the phone can resume the transfer sooner.
server.tomcat.connection-timeout=20s
# Gzip the UI and API responses (about 3x smaller for a phone). Not files or the event stream: those types aren't listed.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
# "Add to Home screen" reads the icon and name from this file.
server.mime-mappings.webmanifest=application/manifest+json
# index.html, the service worker and the icons are re-checked on every load (a quick 304), so a new build shows up
# straight away. The hashed files under /assets are cached for good instead (see WebConfig).
spring.web.resources.cache.cachecontrol.no-cache=true

drop.storage-dir=${user.home}/AndroidDrop
# Name shown to other devices. Leave blank to use this computer's name.
drop.host-name=
drop.pairing-code-ttl=10m
drop.max-pairing-attempts=5
drop.max-text-length=100000
# HTTPS for phones, next to plain HTTP on server.port. 443 (the default port) is what lets Chrome on Android install
# AndroidDrop as an app for the share menu. If it's taken, 8443 is used instead. 0 turns HTTPS off.
drop.https-port=443

